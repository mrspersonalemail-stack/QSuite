[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qsuite"
dynamic = ["version"]
description = "Least-privilege server operations for Debian and Ubuntu"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "argon2-cffi>=23,<26",
  "cryptography>=50.0.2,<51", "pyotp>=2.9,<3", "psutil>=6,<8", "httpx>=0.28,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1.4.0,<2", "ruff>=0.9,<1", "mypy>=1,<2"]

[project.scripts]
qsuite = "qsuite.cli:main"
qsuite-agent = "qsuite.api:main"
qsuite-helper = "qsuite.helper:main"
qsecurity = "qsuite.security:main"
qsuite-watchdog = "qsuite.watchdog:main"
qsuite-network-guard = "qsuite.network_guard:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
qsuite = ["web/*", "defaults/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "Depends", "permission"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S104", "S108"]
"backend/qsuite/api.py" = ["B008"] # FastAPI dependency factories execute at route registration, not per request.
"backend/qsuite/accounts.py" = ["B008"] # Same FastAPI dependency factory contract.
"backend/qsuite/control_center.py" = ["B008"] # Same FastAPI dependency factory contract.
"backend/qsuite/downloads.py" = ["B008"] # Same FastAPI dependency factory contract.

[tool.setuptools.dynamic]
version = {attr = "qsuite.__version__"}
