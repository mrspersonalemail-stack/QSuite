name: QSuite isolated checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: isolated-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:bookworm', 'debian:trixie', 'ubuntu:24.04', 'ubuntu:26.04']
    container: ${{ matrix.image }}
    steps:
      - name: Prepare isolated distro runtime
        run: |
          apt-get update
          apt-get install -y python3 python3-venv python3-pip nodejs git ca-certificates openssl dpkg-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trust only the mounted checkout in this disposable container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install locked runtime and development tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.lock
          .venv/bin/pip install -e '.[test]' build pip-audit
      - name: Defensive tests and source checks
        run: |
          .venv/bin/pytest -q
          .venv/bin/ruff check backend tests scripts
          .venv/bin/mypy --follow-imports=skip --ignore-missing-imports backend/qsuite/config.py backend/qsuite/permissions.py backend/qsuite/notifications.py
          .venv/bin/pip check
          node --check backend/qsuite/web/app.js
          node --check backend/qsuite/web/ui.js
          node --check backend/qsuite/web/center.js
          node --test tests/frontend.test.cjs
          .venv/bin/python scripts/check-release.py
      - name: Dependency vulnerability check
        run: .venv/bin/pip-audit --disable-pip --no-deps -r requirements.lock
      - name: Build and inspect Python/Debian payload
        run: |
          umask 022
          git ls-files -z | xargs -0 chmod go-w
          # Editable test installation may leave metadata with the runner's
          # permissive umask. Recreate only generated packaging state.
          rm -rf build backend/qsuite.egg-info
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          .venv/bin/python -m build
          mkdir -p dist/wheelhouse
          .venv/bin/pip download --require-hashes --only-binary=:all: -r requirements.lock -d dist/wheelhouse
          cp dist/qsuite-1.1.0-py3-none-any.whl dist/wheelhouse/
          MINOR=$(python3 -c 'import sys; print(sys.version_info.minor)')
          .venv/bin/python scripts/build-deb.py --wheelhouse dist/wheelhouse --architecture amd64 --python-minor "$MINOR" --output dist
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          .venv/bin/python scripts/inspect-artifacts.py dist
          python3 -m venv .smoke-venv
          .smoke-venv/bin/pip install --no-index --find-links dist/wheelhouse qsuite==1.1.0
          .smoke-venv/bin/python -I scripts/smoke-package.py
          .smoke-venv/bin/pip check
          (cd dist && sha256sum *.whl *.tar.gz *.deb > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ strategy.job-index }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
  # Container checks do not qualify PID-1 install/start/upgrade/removal/reboot.
  # The separate hosted VM job below qualifies an actual Ubuntu systemd install.

  installed-lifecycle:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: candidate-2
            minor: 12
          - runner: ubuntu-26.04
            artifact: candidate-3
            minor: 14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: qualified
      - name: Prepare fresh hosted VM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv openssl ca-certificates ufw ipset iproute2 iputils-ping
          cd qualified
          sha256sum -c SHA256SUMS
      - name: Qualify installed services and package lifecycle on disposable VM
        run: |
          sudo env RUNNER_ENVIRONMENT=github-hosted QSUITE_DISPOSABLE_QUALIFICATION=yes \
            /usr/bin/python3 scripts/qualify-deb.py qualified/qsuite_1.1.0_py3${{ matrix.minor }}_amd64.deb \
            --report "$GITHUB_WORKSPACE/qualification.json"
      - name: Service diagnostics on failure
        if: failure()
        run: |
          sudo systemctl status qsuite-helper qsuite-agent qsecurity qsuite-watchdog.timer --no-pager || true
          sudo journalctl -u qsuite-agent -u qsuite-helper -u qsecurity -n 80 --no-pager
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-qualification-${{ matrix.minor }}
          path: qualification.json
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan public files and all reachable history
        run: |
          curl -fL --retry 3 -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner
          /tmp/gitleaks git . --redact --no-banner --log-opts=--all
